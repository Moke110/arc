model:
  ATTN:
    n_heads: 8
    attention_probs_dropout_prob: 0.1
    hidden_dropout_prob: 0.1
    cell_input_hidden_dropout_prob: 0.1
    drug_input_hidden_dropout_prob: 0.1
    topk_cell: 128
    topk_drug: 32
    sparse_flag: False
    hidden_size: 256
    trt_structure: CA+SA+SA+CA
    ctl_structure: SA+SA+SA+SA
    ppi_gene_vector_path: ../../pert_model/xpert/metadata/PPI_gene_vector_128d.npy

dataset:
  n_bins: 128
  gene_num: 978
  atom_num: 24
  max_atom_size: 122
  max_value: 14.305
  min_value: 0.0

  panacea:
    num_pert_dose: 10
    num_pert_time: 3
    num_cell_id: 240
    num_tissue_id: 21

  PANACEA_data_root: finetune/data/PANACEA_sdst_352.h5ad

drug_embeddings:
  unimol: drug_embeddings/all_drugs_unimol_arr.npy
  smi: drug_embeddings/all_drugs_idx2smi.npy
  HG: drug_embeddings/all_drugs_idx2HG.npy

split_methods:
  random:
    folds: [random_fold-1, random_fold-2, random_fold-3, random_fold-4, random_fold-5]
  warm-drug:
    folds: [warm-drug_fold-1, warm-drug_fold-2, warm-drug_fold-3, warm-drug_fold-4, warm-drug_fold-5]
  cold-drug:
    folds: [cold-drug_fold-1, cold-drug_fold-2, cold-drug_fold-3, cold-drug_fold-4, cold-drug_fold-5]
