model:
  ATTN:
    n_heads: 8
    attention_probs_dropout_prob: 0.1
    hidden_dropout_prob: 0.1
    cell_input_hidden_dropout_prob: 0.1
    drug_input_hidden_dropout_prob: 0.1
    topk_cell: 128
    topk_drug: 32
    sparse_flag: false
    hidden_size: 256
    trt_structure: CA+SA+SA+CA
    ctl_structure: SA+SA+SA+SA
    ppi_gene_vector_path: ../../pert_model/xpert/metadata/PPI_gene_vector_128d.npy
dataset:
  n_bins: 128
  gene_num: 978
  atom_num: 24
  max_atom_size: 122
  max_value: 15.002
  min_value: 0.0
  cm:
    num_pert_dose: 10
    num_pert_time: 3
    num_cell_id: 1
    num_tissue_id: 1
  DTOX_data_root: 03_cm_finetune_data/output/cm_union.h5ad
drug_embeddings:
  unimol: input/all_drugs_unimol_arr.npy
  smi: input/all_drugs_idx2smi.npy
  HG: 01_drug_embed/output/all_drugs_idx2HG.npy
split_methods:
  warm-start:
    folds:
    - warm-start_fold-1
    - warm-start_fold-2
    - warm-start_fold-3
    - warm-start_fold-4
    - warm-start_fold-5
    - warm-start_fold-6
    - warm-start_fold-7
    - warm-start_fold-8
    - warm-start_fold-9
    - warm-start_fold-10
  cm_full:
    folds:
    - cm_full
