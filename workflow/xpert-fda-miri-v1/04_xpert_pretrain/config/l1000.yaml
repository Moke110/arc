model:
  ATTN:
    n_heads: 8
    attention_probs_dropout_prob: 0.1
    hidden_dropout_prob: 0.1
    cell_input_hidden_dropout_prob: 0.1
    drug_input_hidden_dropout_prob: 0.1
    topk_cell: 128
    topk_drug: 32
    sparse_flag: False
    hidden_size: 256
    trt_structure: CA+SA+SA+CA
    ctl_structure: SA+SA+SA+SA
    ppi_gene_vector_path: ../../pert_model/xpert/metadata/PPI_gene_vector_128d.npy

dataset:
  n_bins: 128
  gene_num: 978
  atom_num: 24
  max_atom_size: 122
  max_value: 15.002
  min_value: 0.0

  l1000:
    num_pert_dose: 10
    num_pert_time: 3
    num_cell_id: 240
    num_tissue_id: 21

  l1000_mdmt_pretrain_data_root: ../../pert_data/l1000-xpert/data/l1000_mdmt_268022_pretrain.h5ad
  l1000_mdmt_full_data_root: ../../pert_data/l1000-xpert/data/l1000_mdmt_full_336852.h5ad
  l1000_mdmt_example_data_root: ../../pert_data/l1000-xpert/data/l1000_mdmt_example.h5ad

drug_embeddings:
  unimol: input/all_drugs_unimol_arr.npy
  smi: input/all_drugs_idx2smi.npy
  HG: input/HG_drug_embeddings.npy

split_methods:
  pretrain_split:
    folds: [pretrain_fold]
