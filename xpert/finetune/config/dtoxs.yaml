model:
  ATTN:
    n_heads: 8
    attention_probs_dropout_prob: 0.1
    hidden_dropout_prob: 0.1
    cell_input_hidden_dropout_prob: 0.1
    drug_input_hidden_dropout_prob: 0.1
    topk_cell: 128
    topk_drug: 32
    sparse_flag: false
    hidden_size: 256
    trt_structure: CA+SA+SA+CA
    ctl_structure: SA+SA+SA+SA
    ppi_gene_vector_path: drug_embeddings/PPI_gene_vector_128d.npy
dataset:
  n_bins: 128
  gene_num: 978
  atom_num: 24
  max_atom_size: 122
  max_value: 15.993
  min_value: 1.854
  dtoxs:
    num_pert_dose: 1
    num_pert_time: 3
    num_cell_id: 1
    num_tissue_id: 1
  DTOX_data_root: finetune/data/dtoxs.h5ad
drug_embeddings:
  unimol: drug_embeddings/all_drugs_unimol_arr.npy
  KPGT: drug_embeddings/all_drugs_idx2KPGT.npy
  morgan: drug_embeddings/all_drugs_idx2morgan.npy
  smi: drug_embeddings/all_drugs_idx2smi_8981.npy
  HG: drug_embeddings/all_drugs_idx2HG.npy
split_methods:
  warm:
    folds:
    - warm_fold-1
    - warm_fold-2
    - warm_fold-3
    - warm_fold-4
    - warm_fold-5
    - warm_fold-6
    - warm_fold-7
